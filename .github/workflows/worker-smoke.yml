name: worker-smoke

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-smoke.yml"
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke dependencies
        run: pip install -r worker/requirements-smoke.txt
      - name: Synthetic scale and walls
        run: python worker/smoke_test.py
